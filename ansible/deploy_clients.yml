---
# deploy_clients.yml — Deploys pub/sub code to publisher + subscriber VMs
# Installs Python, pika, pyzmq, and syncs NTP for accurate latency measurement.

- name: Deploy Client Nodes
  hosts: publishers, subscribers
  become: true
  vars:
    app_dir: /opt/pubsub
    broker_ip: "{{ hostvars[groups['broker'][0]]['ansible_host'] }}"

  tasks:
    - name: Install Python 3, pip, build tools, NTP
      apt:
        name: [python3, python3-pip, python3-venv, python3-dev, build-essential,
               libzmq3-dev, ntpdate, chrony]
        state: present
        update_cache: true

    - name: Sync clock via NTP (critical for latency measurement accuracy)
      command: ntpdate -u pool.ntp.org
      changed_when: false
      ignore_errors: true

    - name: Enable chrony for continuous NTP sync
      systemd:
        name: chronyd
        enabled: true
        state: started

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy project files
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=ansible/"
          - "--exclude=docker/"
          - "--exclude=results/"

    - name: Create Python virtual environment
      command: python3 -m venv {{ app_dir }}/venv
      args:
        creates: "{{ app_dir }}/venv/bin/python"
      become: false

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      become: false

    - name: Write broker config
      copy:
        dest: "{{ app_dir }}/config.env"
        content: |
          BROKER_HOST={{ broker_ip }}
          BROKER_PORT=5672
          RMQ_USER=pubsub
          RMQ_PASS=pubsub_secret
        mode: "0600"

    - name: Print deployment info
      debug:
        msg: "Deployed to {{ ansible_host }}. App: {{ app_dir }}. Broker: {{ broker_ip }}:5672"
